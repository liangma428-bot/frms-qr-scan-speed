<dialog id="viewer" aria-label="单个二维码放大展示"><div class="viewer-top"><strong id="viewer-label"></strong><button class="action" id="close-viewer" type="button" aria-label="关闭放大展示">关闭</button></div><div class="viewer-code" id="viewer-code"></div><p class="viewer-value" id="viewer-value"></p><div class="viewer-actions"><button class="action" id="previous" type="button">上一个</button><span id="viewer-count"></span><button class="action primary" id="next" type="button">下一个</button></div><p class="viewer-help">电脑上按左右方向键切换二维码</p></dialog>
<script>
const codes=[...document.querySelectorAll('.code')],viewer=document.getElementById('viewer');let current=0;
function showCode(index){current=(index+codes.length)%codes.length;const card=codes[current];document.getElementById('viewer-code').replaceChildren(card.querySelector('svg').cloneNode(true));document.getElementById('viewer-label').textContent=card.querySelector('strong').textContent;document.getElementById('viewer-value').textContent=card.querySelector('small').textContent;document.getElementById('viewer-count').textContent=(current+1)+' / '+codes.length;if(!viewer.open)viewer.showModal()}
document.getElementById('open-viewer').addEventListener('click',()=>showCode(0));codes.forEach(card=>card.addEventListener('click',()=>showCode(Number(card.dataset.index))));document.getElementById('close-viewer').addEventListener('click',()=>viewer.close());document.getElementById('previous').addEventListener('click',()=>showCode(current-1));document.getElementById('next').addEventListener('click',()=>showCode(current+1));document.addEventListener('keydown',event=>{if(!viewer.open)return;if(event.key==='ArrowRight')showCode(current+1);if(event.key==='ArrowLeft')showCode(current-1)});
</script></body></html>
